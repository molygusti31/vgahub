<!-- @format -->

<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<meta
			name="theme-color"
			content="#101725" />
		<title>VGAHub | Control Center</title>
		<link
			rel="stylesheet"
			href="/control-center/style.css" />
		<script
			src="/control-center/app.js"
			defer></script>
	</head>
	<body>
		<div class="shell">
			<main>
				<section
					class="card server-card"
					aria-labelledby="server-title">
					<div class="section-heading">
						<div
							class="section-icon"
							aria-hidden="true">
							▣
						</div>
						<div>
							<h2 id="server-title">Server aplikasi</h2>
							<!-- <p>Atur koneksi dashboard lokal Anda</p> -->
						</div>
						<span
							class="status-badge"
							id="server-status"
							data-status="loading">
							<span class="status-dot"></span>
							Menghubungkan
						</span>
					</div>

					<div class="divider"></div>

					<form
						class="server-controls"
						id="server-form">
						<label
							class="port-field"
							for="server-port">
							<span class="field-label">PORT SERVER</span>
							<input
								id="server-port"
								name="port"
								type="number"
								min="1"
								max="65535"
								value="3000"
								required />
							<span class="field-hint">Port lokal antara 1–65535</span>
						</label>
						<button
							class="button button-start"
							id="toggle-server"
							type="button"
							disabled>
							<span aria-hidden="true">▶</span>
							<span>Start server</span>
						</button>
					</form>

					<div
						class="notice"
						id="notice"
						role="status"
						aria-live="polite"></div>
					<a
						class="dashboard-link"
						id="dashboard-link"
						href="#"
						target="_blank"
						rel="noreferrer"
						hidden>
						Buka dashboard <span aria-hidden="true">↗</span>
					</a>
				</section>

				<section
					class="card logs-card"
					aria-labelledby="logs-title">
					<div class="section-heading logs-heading">
						<div class="logs-title-row">
							<button
								class="collapse-button"
								id="collapse-terminal"
								type="button"
								aria-label="Sembunyikan terminal"
								aria-expanded="true"
								title="Sembunyikan terminal">
								<span
									class="arrow-icon"
									aria-hidden="true">🔻</span>
							</button>
							<h2 id="logs-title">Aktivitas server</h2>
						</div>
						<span class="live-badge"><span></span> LIVE</span>
					</div>

					<div class="logs-content">
						<div class="terminal">
							<div class="terminal-toolbar">
								<div
									class="window-dots"
									aria-hidden="true">
									<i></i><i></i><i></i>
								</div>
								<span>dashboard-server &nbsp; ~/weighing-app</span>
								<button
									class="clear-button"
									id="clear-logs"
									type="button">
									Bersihkan
								</button>
							</div>
							<pre
								class="terminal-output"
								id="terminal-output"
								aria-label="Log server"
								aria-live="polite">Menghubungkan ke pengelola...</pre>
						</div>
						<div class="logs-footer">
							<span><i></i> Terminal terhubung</span>
							<span class="session-label">LOCAL SESSION</span>
						</div>
					</div>
				</section>

				<footer class="footer">
					<p>VGA SCALE INDONEISA | VGAhub @RnD</p>
				</footer>
			</main>
		</div>
	</body>
</html>
